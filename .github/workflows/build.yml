name: Build APK

# Сборка при каждом пуше и по кнопке Run workflow
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на раннере ubuntu-latest —
      # отдельная установка не нужна (setup-android@v3 падает на новом sdkmanager)

      - name: Сборка debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Сохранить APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Tizen-pult-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
