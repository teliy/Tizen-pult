plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.teliy.tizenpult'
    compileSdk 34

    defaultConfig {
        applicationId "com.teliy.tizenpult"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.9"
    }

    // Фиксированный ключ подписи в репозитории: все сборки CI взаимно совместимы,
    // обновления устанавливаются поверх предыдущих без удаления приложения.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'tizenpult'
            keyAlias 'tizenpult'
            keyPassword 'tizenpult'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
