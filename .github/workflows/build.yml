name: Build APK & AAB

# Сборка при каждом пуше и по кнопке Run workflow;
# при пуше тега v* — сборка + автоматический Release с APK (сидлоад/RuStore)
# и AAB (обязателен для новых приложений в Google Play)
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на раннере ubuntu-latest —
      # отдельная установка не нужна (setup-android@v3 падает на новом sdkmanager)

      - name: Сборка debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Сборка App Bundle (для Google Play)
        run: ./gradlew bundleRelease --no-daemon

      - name: Сохранить APK и AAB в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Pultoo-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Публикация Release (только при пуше тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/debug/app-debug.apk "Tizen-Pult-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Tizen-Pult-${TAG}.aab"
          gh release create "$TAG" "Tizen-Pult-${TAG}.apk" "Tizen-Pult-${TAG}.aab" \
            --title "Pultoo ${TAG}" \
            --notes "Автоматическая сборка из ветки main (${GITHUB_SHA::7}).

          Pultoo: Remote for Samsung — пульт для Samsung Smart TV.

          APK — установка на телефон (скачать и открыть) и для RuStore.
          AAB — для загрузки в Google Play Console.
          Обновление внутри приложения: кнопка «Проверить обновления»." \
            --repo "${GITHUB_REPOSITORY}"
